services:
  - type: web
    name: parseiq-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: VISION_PROVIDER
        value: gemini
      - key: PARSEIQ_CORS_ORIGINS
        sync: false
